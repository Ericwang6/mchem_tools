[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mchem"
version = "0.1.0"
description = "M-Chem front-end: convert PDB to SQLite-DB formatted force-field parameters"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
  "numpy",
  "scipy",
  "networkx",
  "rich-click",
  "h5py",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
mchem-tools = "mchem.main:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "openmm"
]
docs = [
  "sphinx>=5.0.0",
  "sphinx-rtd-theme>=1.0.0",
  "sphinx-autodoc-typehints>=1.19.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mchem*"]

[tool.setuptools.package-data]
# XML force-field and residue-template files are loaded at runtime relative to
# the package directory, so they must ship inside the wheel.
mchem = [
  "forcefield/*.xml",
  "templates/*.xml",
  "templates/*/*.xml",
]
